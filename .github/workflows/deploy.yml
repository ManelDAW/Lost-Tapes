name: Deploy Lost Tapes Project

# Se ejecuta automáticamente cada vez que haces un 'git push' a rama-sprint5
on:
  push:
    branches:
      - rama-sprint5

jobs:
  # TRABAJO 1: COMPILACIÓN (Dependencias y Build de Vue)
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar el entorno de Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 3. Instalar dependencias de npm y compilar el proyecto Vue
      - name: Instalar dependencias y compilar Vue
        run: |
          npm ci --progress=false
          npm run build

  # TRABAJO 2: DESPLIEGUE AUTOMÁTICO (A la instancia Frontend, vía Edge)
  deploy-to-ec2:
    runs-on: ubuntu-latest
    needs: build-frontend

    steps:
      # 1. Configurar la clave SSH secreta para saltar a través de Edge
      - name: Configurar SSH (vía Edge)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config <<EOF
          Host edge
            HostName ${{ secrets.EDGE_HOST }}
            User ubuntu
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no

          Host frontend
            HostName ${{ secrets.FRONTEND_HOST }}
            User ubuntu
            IdentityFile ~/.ssh/deploy_key
            ProxyJump edge
            StrictHostKeyChecking no
          EOF

      # 2. Desplegar: la propia instancia actualiza el código y recompila
      #    (así usa su .env con la URL real de la API en producción)
      - name: Desplegar en la instancia Frontend
        run: |
          ssh frontend '
            cd /var/www/frontend &&
            git fetch origin &&
            git reset --hard origin/rama-sprint5 &&
            sudo npm ci --progress=false &&
            sudo npm run build
          '
