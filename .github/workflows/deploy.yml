name: Deploy Frontend to EC2

on:
  push:
    branches:
      - main  # O la rama que uses para producción (por ejemplo, master)

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # Cambia a la versión de Node que use tu proyecto (18, 20, etc.)

      - name: Instalar dependencias y compilar
        run: |
          npm install
          npm run build

      - name: Configurar la clave privada SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Evita que el pipeline se congele pidiendo confirmación del host
          ssh-keyscan -H 44.193.254.173 >> ~/.ssh/known_hosts

      - name: Desplegar archivos con rsync
        run: |
          # El truco está en: --no-perms --no-owner --no-group
          # Esto sube los archivos de dist/ sin intentar cambiar los dueños de Linux
          rsync -avz --delete --no-perms --no-owner --no-group ./ dist/ ubuntu@44.193.254.173:/var/www/frontend/
