name: Deploy Lost Tapes Project

# Se ejecuta automáticamente cada vez que haces un 'git push' a la rama main
on:
  push:
    branches:
      - main

jobs:
  # TRABAJO 1: COMPILACIÓN (Dependencias y Build de Vue)
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar el entorno de Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Versión estable recomendada para proyectos actuales

      # 3. Instalar dependencias de npm y compilar el proyecto Vue
      - name: Instalar dependencias y compilar Vue
        run: |
          npm install --progress=false
          npm run build
      # 4. Guardar todo el proyecto listo (incluyendo los archivos compilados de Vue)
      # para que el siguiente trabajo de despliegue pueda acceder a ellos
      - name: Guardar artefacto del proyecto
        uses: actions/upload-artifact@v4
        with:
          name: production-ready-code
          path: .
          retention-days: 1

  # TRABAJO 2: DESPLIEGUE AUTOMÁTICO (A tu servidor EC2)
  deploy-to-ec2:
    runs-on: ubuntu-latest
    needs: build-frontend 

    steps:
      # 1. Descargar el código ya compilado del paso anterior
      - name: Descargar código compilado
        uses: actions/download-artifact@v4
        with:
          name: production-ready-code
          path: .

      # 2. Configurar la clave SSH secreta y hacer el despliegue con rsync
      - name: Configurar SSH y desplegar con Rsync
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          # Configurar el directorio .ssh y la clave privada
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Evitar que pregunte interactivamente si confías en el servidor externo
          echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
          
          # Hacer el rsync automático al directorio de Nginx/Apache de tu servidor AWS.
          # NOTA: Asegúrate de excluir directorios que no quieras machacar (como .git o node_modules si no los usas en producción)
          rsync -rav --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            ./ ubuntu@44.193.138.37:/var/www/lost-tapes/html/
