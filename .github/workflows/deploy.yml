name: Deploy Lost Tapes Project

# Se ejecuta automáticamente cada vez que haces un 'git push' a la rama main
on:
  push:
    branches:
      - main

jobs:
  # TRABAJO 1: COMPILACIÓN (Dependencias y Build de Vue)
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      # 1. Clonar el repositorio
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar el entorno de Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Instalar dependencias de npm y compilar el proyecto Vue
      - name: Instalar dependencias y compilar Vue
        run: |
          npm install --progress=false
          npm run build

      # 4. Guardar SOLO los archivos compilados de la carpeta /dist
      - name: Guardar artefacto del proyecto
        uses: actions/upload-artifact@v4
        with:
          name: production-ready-code
          path: dist/
          retention-days: 1

  # TRABAJO 2: DESPLIEGUE AUTOMÁTICO (A tu servidor EC2)
  deploy-to-ec2:
    runs-on: ubuntu-latest
    needs: build-frontend 
    steps:
      # 1. Descargar el código compilado (el contenido de /dist)
      - name: Descargar código compilado
        uses: actions/download-artifact@v4
        with:
          name: production-ready-code
          path: ./dist

      # 2. Configurar la clave SSH secreta y hacer el despliegue con rsync
      - name: Configurar SSH y desplegar con Rsync
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          # Configurar el directorio .ssh y la clave privada
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Evitar que pregunte interactivamente si confías en el servidor externo
          echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
          
          # RSYNC SEGURO: Quitamos '--delete' para NO borrar el backend de tu compañero.
          # Usamos -rlptgoD en lugar de -a para evitar conflictos de tiempos y dueños.
          rsync -rlptgoD --no-perms --no-owner --no-group ./dist/ ubuntu@44.193.254.173:/var/www/Lost-Tapes/current/public/
