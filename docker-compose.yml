services:
  frontend:
    image: node:20-alpine
    container_name: lost-tapes-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000/api}
